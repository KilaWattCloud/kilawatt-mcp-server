name: Test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 18.x, 20.x, 22.x ]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    
    - name: Install dependencies
      run: npm ci

    - name: Audit dependencies
      run: npm audit --audit-level=high

    - name: Check syntax and MCP protocol
      run: npm run check

    - name: Validate tool inputs
      run: node test/input-validation.test.js

    - name: Check error output
      run: node test/security-output.test.js

    - name: Smoke test startup and tool listing
      run: node test/startup-smoke.test.js

    - name: Dry-run package archive
      run: npm pack --dry-run
