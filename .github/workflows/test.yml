name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 18.x, 20.x ]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    
    - name: Install dependencies
      run: npm install
    
    - name: Check syntax and MCP protocol
      run: npm run check

    - name: Test server startup
      run: |
        set +e
        timeout 5s env KILAWATT_API_KEY=kw_live_ci npm start > /tmp/server.log 2>&1
        status=$?
        set -e
        cat /tmp/server.log
        if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
          echo "Server startup failed with exit code $status"
          exit 1
        fi
        grep -q "ready on stdio" /tmp/server.log
